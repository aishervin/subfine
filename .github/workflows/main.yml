name: Filter V2Ray Configs

on:
  schedule:
    # هر یک ساعت در دقیقه صفر (به وقت UTC)
    - cron: '0 * * * *'
  workflow_dispatch:
    # اجازه اجرای دستی از طریق تب Actions

jobs:
  filter-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run filter script
        run: python filter_v2ray.py

      - name: Upload sub.txt as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sub-file
          path: sub.txt
          retention-days: 7

      - name: Commit sub.txt to repository
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add sub.txt
          git commit -m "Update sub.txt (filtered configs)" || echo "No changes to commit"
          git push
